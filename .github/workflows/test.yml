name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm run pi-check
      - name: Run deterministic eval gate
        run: npm run eval -- run --dataset examples/evals/dataset.jsonl --baseline examples/evals/baseline.json --candidate examples/evals/candidate.json
      - run: PYTHONPATH=python python -m unittest discover -s python/tests -v
      - run: PYTHONPATH=python python -m from_scratch_agent.eval_cli --dataset examples/evals/dataset.jsonl --baseline examples/evals/baseline.json --candidate examples/evals/candidate.json
